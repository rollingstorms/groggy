name: Qualify release artifacts and publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "0"
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  native-gates:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.1
        components: clippy
    - name: Validate capability publication
      run: python3 notes/scripts/build_capability_matrix.py --check
    - run: cargo generate-lockfile
    - run: cargo test --locked
    - run: cargo test --locked --lib killed_checkpoint_process -- --ignored --test-threads=1
    - run: cargo clippy --locked --all-targets -- -D warnings

  build-wheels:
    name: Qualify CPython ${{ matrix.python-version }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
        exclude:
          # CPython 3.8 has no native macOS arm64 distribution.
          - python-version: "3.8"
            platform:
              os: macos-15
              target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel for the selected interpreter
      uses: PyO3/maturin-action@v1
      with:
        maturin-version: v1.9.0
        rust-toolchain: 1.96.1
        command: build
        args: --release --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python-version) || 'python' }}
        target: ${{ matrix.platform.target }}
        manylinux: auto
    - name: Install test dependencies
      run: python -m pip install pytest numpy pandas networkx
    - name: Qualify unpacked wheel and application workflow
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: >-
        python notes/scripts/verify_release_wheel.py dist
        --tests ${{ runner.os == 'Linux' && matrix.python-version == '3.12' && 'maintained' || 'ownership' }}
        --release-tag "$RELEASE_TAG" --report wheel-qualification.json
    - name: Upload qualified wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.platform.target }}-cp${{ matrix.python-version }}
        path: dist/*.whl
        if-no-files-found: error
    - name: Upload qualification receipt
      uses: actions/upload-artifact@v4
      with:
        name: qualification-${{ matrix.platform.target }}-cp${{ matrix.python-version }}
        path: wheel-qualification.json
        if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.96.1
    - name: Install build backend
      run: python -m pip install maturin==1.9.0
    - name: Resolve and retain source build dependencies
      run: |
        cargo generate-lockfile
        cargo generate-lockfile --manifest-path python-groggy/Cargo.toml
    - name: Build source distribution
      run: maturin sdist --out dist
    - name: Rebuild and qualify extracted source
      run: >-
        python notes/scripts/verify_release_sdist.py dist
        --out source-wheels --report source-qualification.json
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: qualification-source
        path: source-qualification.json
        if-no-files-found: error

  publish:
    runs-on: ubuntu-22.04
    needs: [native-gates, build-wheels, build-sdist]
    # A manual qualification run can never publish.
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/groggy
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: sdist
        path: dist
    - name: Publish qualified distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
